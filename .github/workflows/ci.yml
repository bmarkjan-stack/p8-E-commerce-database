name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Load database schema, seed data, and extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ecommerce_test -f database/01_schema.sql
          psql -h localhost -U postgres -d ecommerce_test -f database/02_seed.sql
          psql -h localhost -U postgres -d ecommerce_test -f database/04_schema_extensions.sql
          psql -h localhost -U postgres -d ecommerce_test -f database/05_views.sql
          psql -h localhost -U postgres -d ecommerce_test -f database/06_functions_and_procedures.sql
          psql -h localhost -U postgres -d ecommerce_test -f database/07_triggers.sql

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run API tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
          JWT_SECRET: ci-test-secret
        run: npm test
